[package]
name = "calliope"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# E5.10 — counting allocator in the diagnose harness; never in the wasm.
alloc-count = []
# M67/ADR-0027 — the native GPU leg of the compute lane: wgpu on whatever
# adapter the machine offers (report.sh sources lavapipe via nix when the
# machine is headless, so the WGSL executes in CI instead of being claimed).
# Harness-only; the wasm target carries wgpu unconditionally for the renderer.
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
ndarray = "0.16"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_pcg = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_repr = "0.1"
bitflags = "2"
bytemuck = "1"
wasm-bindgen = "0.2"
strum = { version = "0.26", features = ["derive"] }
enum-map = "2"
smallvec = { version = "1", features = ["serde"] }
# M67 — readback synchronization for the compute lane: the map_async
# oneshot handshake, shared by the wasm renderer and the native gpu leg.
futures-channel = "0.3"

[dev-dependencies]
# M15.1 — the assay: property-proofs for the resource economy. Dev-only:
# never in the wasm, never in the shipped binary.
proptest = "1"

# M67 — the compute lane's native leg (feature `gpu`): the same wgpu the
# renderer uses, on native backends, plus a blocking executor for the
# harness. Optional: plain builds never pay the compile.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
wgpu = { version = "24", features = ["webgl"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# E6.2 — no unwind machinery in the shipped binary; nothing in the crate
# catches panics, and the diagnose harness treats a panic as a hard stop
# anyway. Debug builds keep unwinding (and the wasm console panic hook).
panic = "abort"

# M15.1 — the assay's own profile: the proptest harness must unwind to
# report a counterexample, and sharing target/release/ with the
# panic=abort bins collided both lib flavors on one libcalliope.rlib
# (cargo #6313) — flaky phantom link errors. Separate profile, separate
# target dir, zero interference.
[profile.assay]
inherits = "release"
panic = "unwind"

# E6.3 — explicit wasm-opt pass; M66 adds --no-inline=*stage_*: rustc's
# #[inline(never)] holds through LLVM, but binaryen re-merges single-caller
# functions unless told otherwise — the gen stages stay their own bodies.
# The flag must PRECEDE -Oz: binaryen applies options positionally, and a
# no-inline mark set after the pass pipeline ran marks nothing (measured).
# Was: explicit wasm-opt pass (wasm-pack runs this via binaryen on PATH;
# scripts/build.sh's nix path provides it). -O3 measured against -Oz on the
# real binary; producers/target-features metadata stripped (E6.6).
[package.metadata.wasm-pack.profile.release]
# M79 — `--converge` re-runs the -Oz pipeline to a byte fixpoint: binaryen's
# single pass leaves shrinkage on the table because later passes expose work
# earlier ones could have done. Purely a size pass over the same semantics
# (no inlining policy change — --no-inline still precedes it), and the
# earth-wasm replay lane proves the converged binary is bit-identical in
# behaviour. --strip-dwarf drops any residual debug section the release
# codegen leaves behind.
wasm-opt = ["--no-inline=*stage_*", "-Oz", "--converge", "--vacuum", "--strip-producers", "--strip-target-features", "--strip-dwarf"]

# E6.6 — the symbolized twin for scripts/wasm-audit.sh: wasm-opt keeps the
# name section (-g) so twiggy can name what weighs. Never shipped.
[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ["--no-inline=*stage_*", "-O", "-g"]
