[package]
name = "calliope"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.16"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_pcg = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
